<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiteWise Dashboard</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>🍔 BiteWise</h1>
            <p>AI-Powered Food Ordering Platform</p>
        </header>

        <div class="dashboard">
            <!-- User Input -->
            <section class="card user-section">
                <h2>👤 User</h2>
                <div class="input-group">
                    <input type="text" id="userId" value="user-001" />
                    <button onclick="analyzeUser()">Analyze</button>
                    <button onclick="seedUser()">Seed Data</button>
                </div>
            </section>

            <!-- Patterns -->
            <section class="card patterns-section">
                <h2>🧠 User Patterns</h2>
                <div id="patterns-container">
                    <p class="placeholder">Enter a user ID and click "Analyze"</p>
                </div>
            </section>

            <!-- Offers -->
            <section class="card offers-section">
                <h2>🎁 Smart Offers</h2>
                <button onclick="generateOffers()">Generate Offers</button>
                <div id="offers-container">
                    <p class="placeholder">Click "Generate Offers" to see personalized deals</p>
                </div>
            </section>

            <!-- Notifications -->
            <section class="card notifications-section">
                <h2>📢 Notifications</h2>
                <button onclick="getNotifications()">Refresh</button>
                <button onclick="markAllRead()">Mark All Read</button>
                <div id="notifications-container">
                    <p class="placeholder">No notifications yet</p>
                </div>
            </section>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
